# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for Palomar (https://palomar-registry.org/).
version: "v0.4"

project:
  name: "Delocalization of one-dimensional random band matrices"
  description: >-
    A Lean 4 / Mathlib proof of the main results of Yau and Yin, "Delocalization of
    one-dimensional random band matrices" (arXiv:2501.01718). The model is the complex Gaussian
    block band matrix with L blocks of size W, N = WL, and band width W >= N^{1/2+c}. This entry
    contains Theorem 2.2 (delocalization of the bulk eigenvectors, (2.10)), Theorem 2.3 (the
    local semicircle law, (2.3)-(2.4)), Theorem 2.4 (quantum diffusion, (2.6)-(2.9)) and Theorem
    2.5 (quantum unique ergodicity, (2.12)-(2.13)); they have no hypotheses other than their
    parameters, and no result of another work is assumed for them. The library also proves
    Theorem 2.6 (bulk universality) from one external input, stated as an explicit hypothesis;
    that theorem is not part of this entry.
  authors:
    - "Jun Yin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jun Yin"

classification:
  arxiv: ["math.PR", "math-ph"]
  msc2020: ["60B20", "15B52", "82B44"]

sources:
  - title: "Delocalization of one-dimensional random band matrices"
    authors:
      - "Horng-Tzer Yau"
      - "Jun Yin"
    id: "arXiv:2501.01718"
    type: "paper"
    location: "https://arxiv.org/abs/2501.01718"
    relationship: "formalizes"
    note: >-
      The Lean code follows paper/YauYin_RBM1D_Lean_version.pdf in this repository; page,
      equation and theorem numbers in docs/PAPER-VS-LEAN.md refer to it. Jun Yin, a co-author of
      the paper, is the author of the formalization.
    license: "unknown"
    author_endorsement: "endorsed"

related_formalizations: []

status:
  scope: >-
    In this entry (Challenge.lean): Theorems 2.2, 2.3, 2.4 and 2.5. Also proved in the library,
    not in this entry: Theorem 2.6 (bulk universality, (2.18)), which takes the fixed-energy
    universality of Dyson Brownian motion (Landon-Sosoe-Yau, arXiv:1609.09011v4, Theorem 2.2) as
    the explicit hypothesis LSY22' (RBM.Paper.theorem2_6 in RBM1D/PaperMain.lean;
    docs/PAPER-VS-LEAN.md, Section 4).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5", "claude-sonnet-5-5", "claude-fable-5-1", "claude-fable-5-2"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted: a team of Claude Code agents (a dispatcher, workers on ticket worktrees and
        reviewing agents) wrote the Lean code and the comparison documents from the paper's
        source, under the direction of Jun Yin, who fixed the endpoint statements. The upgrade to
        Lean v4.36, the port to the Lean module system and the Challenge/Solution files for
        Palomar were also written with Claude.
      cost:
        wall_time: "about 185 hours of active work between 2026-09-18 and 2026-09-29 (1411 commits in the work repository; the run was paused for long stretches in between)"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The mathematical source is a paper by Horng-Tzer Yau and Jun Yin. The Lean proofs were
    produced by AI agents; the statements of the main theorems and of the definitions they use
    were fixed and checked by Jun Yin against the paper.

fidelity:
  divergences: >-
    (1) Probability bounds are stated for the failure events. (2) Spectral parameters and
    energies are sequences indexed by N, and the Lean index N is related to the matrix size WL as
    described in docs/PAPER-VS-LEAN.md, Section 2.3. (3) L >= 3. (4) Theorems 2.3 and 2.4 have a
    separate exponent tau' for the error. (5) One probability space serves all N. (6) Some
    proofs take a different route from the paper (discrete time grids in place of stopping
    times and Brownian paths). Details: docs/PAPER-VS-LEAN.md, Sections 2, 3 and 5.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    The Lean proof of each ticket was audited by a separate auditing agent, and a supervising
    agent checked the final statements. Jun Yin checked the statements of the main theorems and
    of the definitions they use against the paper. No independent human review has been
    performed.

alignment:
  namespace: "RBM.Paper"
  statements:
    - source: "Theorem 2.2, (2.10)"
      lean: "RBM.Paper.theorem_2_2"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution.lean by RBM.Paper.theorem2_2."
    - source: "Theorem 2.3, (2.3)-(2.4)"
      lean: "RBM.Paper.theorem_2_3"
      module: "Challenge"
      status: "proved"
      note: "Proved by RBM.Paper.theorem2_3."
    - source: "Theorem 2.4, (2.6)-(2.9)"
      lean: "RBM.Paper.theorem_2_4"
      module: "Challenge"
      status: "proved"
      note: "Proved by RBM.Paper.theorem2_4."
    - source: "Theorem 2.5, (2.12)-(2.13)"
      lean: "RBM.Paper.theorem_2_5"
      module: "Challenge"
      status: "proved"
      note: "Proved by RBM.Paper.theorem2_5."

acknowledgements: "Mathlib and the Lean community; Lean 4 (Lean FRO); Claude Code (Anthropic)."
