name = "RBM1D"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RBM1D", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "RBM1D"

# Palomar statement surface: `Challenge` states the results (imports Mathlib only),
# `Solution` proves the same statements from the library. See `comparator.json`.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
