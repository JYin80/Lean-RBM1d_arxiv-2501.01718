<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  {% seo %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#157878">
  <link rel="stylesheet" href="{{ 'assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  {% include mathjax.html %}
</head>
<body>
  <a id="skip-to-content" href="#content">Skip to the content.</a>
  <header class="page-header" role="banner">
    <h1 class="project-name">{{ page.title | default: site.title }}</h1>
    <h2 class="project-tagline">{{ page.description | default: site.description }}</h2>
    <a href="blueprint" class="btn">Blueprint (web)</a>
    <a href="blueprint.pdf" class="btn">Blueprint (pdf)</a>
    <a href="docs" class="btn">Documentation</a>
    {% if site.github.is_project_page %}
    <a href="{{ site.github.repository_url }}" class="btn">GitHub</a>
    {% endif %}
  </header>
  <main id="content" class="main-content" role="main">
    {{ content }}
    <footer class="site-footer"></footer>
  </main>
</body>
</html>
