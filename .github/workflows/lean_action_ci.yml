name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Lean
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check Lean source requirements (module headers, 10,000-line cap)
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@v1
        with:
          build: true
          lint: false
          mk_all-check: false

  comparator:
    name: Check Challenge against Solution (lake comparator)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: false
          lint: false
          mk_all-check: false
      - name: Install bubblewrap for lake comparator's sandbox
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the toolchain's lake comparator
        run: |
          set -o pipefail
          ./scripts/verify-comparator.sh 2>&1 | tee "$RUNNER_TEMP/comparator.log"
      - name: On a mismatch, print the constant from both sides
        if: failure()
        run: |
          name=$(sed -n "s/.*Const does not match between challenge and target '\(.*\)'.*/\1/p" "$RUNNER_TEMP/comparator.log" | head -1)
          [ -n "$name" ] || exit 0
          for side in Challenge Solution; do
            cat > "$RUNNER_TEMP/$side.dbg.lean" <<EOF
          import $side
          import Lean
          open Lean in
          run_cmd do
            let c ← getConstInfo \`$name
            logInfo m!"{c.name} levels={c.levelParams} typeHash={c.type.hash} valueHash={c.value?.map (·.hash)} isThm={c.isTheorem}"
            logInfo m!"constants in value: {(c.value?.map (·.getUsedConstants)).getD #[]}"
          set_option pp.all true in
          set_option pp.proofs true in
          #print $name
          EOF
            echo "=========== $side"; lake env lean "$RUNNER_TEMP/$side.dbg.lean" 2>&1 | head -c 6000 || true
          done

  metadata:
    name: Check formalization.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby scripts/validate-formalization.rb
